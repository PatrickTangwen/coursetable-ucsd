<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">SunGrid — 搜索 UCSD 课程目录，在选课前排出可用的一周</title>
  <desc id="hero-desc">SunGrid 标识旁是一个五列的一周网格，其中若干格子被填色，代表一周里被课程占掉的时段。</desc>

  <rect x="0.5" y="0.5" width="1199" height="419" rx="18" fill="#f9f8f6" stroke="#e7e5e1"/>

  <g id="week-grid">
    <g fill="none" stroke="#e7e5e1">
      <path d="M676 84h460"/>
      <path d="M676 130h460"/>
      <path d="M676 176h460"/>
      <path d="M676 222h460"/>
      <path d="M676 268h460"/>
      <path d="M676 314h460"/>
      <path d="M676 360h460"/>
      <path d="M676 84v276"/>
      <path d="M768 84v276"/>
      <path d="M860 84v276"/>
      <path d="M952 84v276"/>
      <path d="M1044 84v276"/>
      <path d="M1136 84v276"/>
    </g>
    <g>
      <rect x="684" y="92" width="76" height="30" rx="6" fill="#fcebeb" stroke="#f3d6d6"/>
      <rect x="868" y="92" width="76" height="30" rx="6" fill="#fcebeb" stroke="#f3d6d6"/>
      <rect x="1052" y="92" width="76" height="30" rx="6" fill="#fcebeb" stroke="#f3d6d6"/>
      <rect x="776" y="184" width="76" height="76" rx="6" fill="#faeeda" stroke="#ecd8b8"/>
      <rect x="960" y="184" width="76" height="76" rx="6" fill="#faeeda" stroke="#ecd8b8"/>
      <rect x="868" y="276" width="76" height="30" rx="6" fill="#eaf3de" stroke="#cfe1b6"/>
      <rect x="684" y="322" width="76" height="30" rx="6" fill="#e6f1fb" stroke="#85b7eb"/>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif">
    <text x="64" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif" font-size="18" letter-spacing="2.6" fill="#9f9d97">UC SAN DIEGO &#183; 选课规划</text>

    <text x="62" y="196" font-family="Georgia, 'Songti SC', serif" font-size="78" font-weight="700" fill="#0b0b0b">SunGrid</text>

    <text x="64" y="246" font-size="27" fill="#3d3b37">搜索 UCSD 课程目录，</text>
    <text x="64" y="281" font-size="27" fill="#3d3b37">在选课前排出可用的一周。</text>

    <path d="M64 322h472" stroke="#e7e5e1"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif">
      <text x="64" y="354" font-size="16" letter-spacing="1.4" fill="#185fa5">数据来源</text>
      <text x="64" y="378" font-size="18" fill="#3d3b37">公开 UCSD 数据</text>
      <path d="M244 336v46" stroke="#e7e5e1"/>
      <text x="272" y="354" font-size="16" letter-spacing="1.4" fill="#185fa5">时间背景</text>
      <text x="272" y="378" font-size="18" fill="#3d3b37">显示快照发布时间</text>
    </g>
  </g>
</svg>
