<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Find the class. See the week.</title>
  <desc id="desc">An illustrated UCSD course search panel flows into a weekly worksheet with scheduled class blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#edf3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17233c" flood-opacity=".13"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="560" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="560" fill="url(#bg)"/>
    <circle cx="1080" cy="-15" r="180" fill="#dbe8ff" opacity=".65"/>
    <circle cx="470" cy="565" r="150" fill="#e7f8f3" opacity=".75"/>
    <path d="M0 447C154 406 298 449 457 421s268-101 430-71 240 48 313 23v187H0Z" fill="#f8fbff"/>

    <g transform="translate(72 58)">
