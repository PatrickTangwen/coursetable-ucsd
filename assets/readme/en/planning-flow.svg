<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">The course planning loop</title>
  <desc id="desc">Search the catalog, inspect course details, build a worksheet, then check conflicts and export.</desc>
  <defs><linearGradient id="line" gradientUnits="userSpaceOnUse" x1="162" x2="1038"><stop stop-color="#1a56db"/><stop offset=".52" stop-color="#0f766e"/><stop offset="1" stop-color="#6d28d9"/></linearGradient></defs>
  <rect width="1200" height="230" rx="22" fill="#f8faff" stroke="#dce5f3"/>
  <path d="M162 72h876" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(142 72)"><circle r="28" fill="#1a56db"/><text y="7" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">01</text><text y="70" fill="#17233c" font-size="17" font-weight="700" text-anchor="middle">Search the catalog</text><text y="94" fill="#68758a" font-size="12" text-anchor="middle">Code · title · instructor · filters</text></g>
    <g transform="translate(447 72)"><circle r="28" fill="#297e9a"/><text y="7" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">02</text><text y="70" fill="#17233c" font-size="17" font-weight="700" text-anchor="middle">Inspect the details</text><text y="94" fill="#68758a" font-size="12" text-anchor="middle">Meetings · prerequisites · grades</text></g>
    <g transform="translate(752 72)"><circle r="28" fill="#0f766e"/><text y="7" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">03</text><text y="70" fill="#17233c" font-size="17" font-weight="700" text-anchor="middle">Build a worksheet</text><text y="94" fill="#68758a" font-size="12" text-anchor="middle">Calendar · list · term switching</text></g>
    <g transform="translate(1057 72)"><circle r="28" fill="#6d28d9"/><text y="7" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">04</text><text y="70" fill="#17233c" font-size="17" font-weight="700" text-anchor="middle">Check &amp; take it with you</text><text y="94" fill="#68758a" font-size="12" text-anchor="middle">Conflicts · share URL · ICS · PNG</text></g>
  </g>
</svg>
