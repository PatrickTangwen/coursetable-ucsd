name: Roll Out Merged Scheduled Data Refresh

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: scheduled-data-refresh-rollout
  cancel-in-progress: false

jobs:
  qualify:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.pr.outputs.commit }}
      eligible: ${{ steps.pr.outputs.eligible }}
    steps:
      - name: Check out trusted rollout tooling and commit history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Require a merged scheduled-refresh PR
        id: pr
        env:
          DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: bun tools/staging-deployment/qualifyScheduledRefresh.mts

  staging:
    needs: qualify
    if: ${{ needs.qualify.outputs.eligible == 'true' }}
    uses: ./.github/workflows/cloudflare-staging-deploy.yml
    secrets: inherit
    with:
      target: staging
      commit: ${{ needs.qualify.outputs.commit }}
      recover_unaccepted_first_deployment: false
      recover_unaccepted_worker_version: ''

  production:
    needs:
      - qualify
      - staging
    uses: ./.github/workflows/cloudflare-production-deploy.yml
    secrets: inherit
    with:
      target: production
      commit: ${{ needs.qualify.outputs.commit }}
      staging_accepted_commit: ${{ needs.qualify.outputs.commit }}
      public_login_enabled: true
      prove_rollback_after_smoke: false
      recover_unaccepted_first_deployment: false
      recover_unaccepted_worker_version: ''
